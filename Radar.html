<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regenradar Dummersdorf</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--head:#4f4f4c;--bg:#424242}
html,body{height:100%;margin:0;background:var(--bg);font-family:Roboto,"Segoe UI",Arial,sans-serif}
.wrap{display:flex;flex-direction:column;height:100%}
h1{margin:0;flex:none;text-align:center;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;height:min(29vh,76px);font-size:clamp(16px,min(11vh,42px),46px);line-height:1;padding:0 1vw;background:var(--head)}
#map{flex:1;min-height:0;background:#1d2026}
.leaflet-container{font-family:inherit}
.stand{position:absolute;right:6px;bottom:6px;z-index:1000;background:rgba(20,24,34,.75);color:#dfe3f0;font-size:clamp(10px,1.8vh,15px);padding:2px 8px;border-radius:4px}
.tl{--H:clamp(36px,16vh,60px);position:absolute;left:6px;right:6px;bottom:6px;height:var(--H);z-index:1000;display:none;background:rgba(237,240,249,.95);border-radius:10px;font-family:inherit}
.trk{position:absolute;left:16px;right:16px;top:0;bottom:0}
.tl .fcz{position:absolute;top:0;bottom:0;right:-16px;background:rgba(120,150,225,.16);border-radius:0 10px 10px 0}
.tl .line{position:absolute;left:-4px;right:-4px;bottom:calc(var(--H)*.36);height:3px;border-radius:2px;background:#c3c7d2}
.tl .tk{position:absolute;bottom:calc(var(--H)*.36 + 3px);width:1px;height:calc(var(--H)*.1);background:#9aa0ad}
.tl .tk.q{height:calc(var(--H)*.16);background:#8a91a0}
.tl .tk.h{height:calc(var(--H)*.22);background:#6f7686}
.tl .lb{position:absolute;bottom:calc(var(--H)*.36 + var(--H)*.25);transform:translateX(-50%);font-size:clamp(8px,2.6vh,13px);color:#6f7686;font-weight:500}
.tl .jt{position:absolute;top:calc(var(--H)*.68);transform:translateX(-50%);font-size:clamp(8px,2.6vh,13px);color:#555c6b}
.tl .nl{position:absolute;bottom:calc(var(--H)*.36);height:calc(var(--H)*.55);width:1.5px;background:#7d8493}
.tl .hd{position:absolute;bottom:calc(var(--H)*.36 + 1.5px);width:0;height:0}
.tl .knob{position:absolute;width:clamp(12px,5vh,19px);height:clamp(12px,5vh,19px);left:calc(clamp(12px,5vh,19px)/-2);bottom:calc(clamp(12px,5vh,19px)/-2);border:2.5px solid #0b3a8a;background:#fff;border-radius:50%;box-sizing:border-box}
.tl .stem{position:absolute;left:-1px;bottom:0;width:2px;height:calc(var(--H)*.64 + 3px);background:#262b36}
.tl .bub{position:absolute;left:0;transform:translateX(-50%);bottom:calc(var(--H)*.64 + 3px);background:#edf0f9;border:1px solid #c3c7d2;border-bottom:0;border-radius:6px 6px 0 0;padding:1px clamp(5px,1.4vw,9px);font-size:clamp(10px,3.4vh,17px);font-weight:700;color:#1b2030;white-space:nowrap}
.tl .bub.f{background:#dbe6fb}
.luebeck{background:rgba(0,0,0,.55) !important;color:#fff !important;border:0 !important;box-shadow:none !important;font-weight:700;font-size:clamp(12px,3.8vh,20px);padding:1px 7px !important;text-shadow:0 0 4px #000}
.luebeck:before{display:none !important}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;text-align:center;padding:20px}
.leaflet-control-attribution{font-size:9px !important;background:rgba(20,24,34,.6) !important;color:#aab !important}
.leaflet-control-attribution a{color:#cdd !important}
</style></head>
<body><div class="wrap"><h1>Regenradar</h1><div id="map"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
var q=new URLSearchParams(location.search);
if(q.get('bg'))document.documentElement.style.setProperty('--bg','#'+q.get('bg'));
if(q.get('head'))document.documentElement.style.setProperty('--head','#'+q.get('head'));
var lat=parseFloat(q.get("lat")||"53.945"),lon=parseFloat(q.get("lon")||"10.745"),zoom=parseInt(q.get("zoom")||"10",10);
var mapEl=document.getElementById("map");
if(!window.L){mapEl.innerHTML='<div class="msg">Karte konnte nicht geladen werden.</div>';return;}
var ADDR=q.get("adresse")||"Wischhofweg 24, 23569 Lübeck";
function geo(cb){if(q.get("lat"))return cb();try{var c=JSON.parse(localStorage.getItem("geoDummersdorf1"));if(c&&c.length==2){lat=c[0];lon=c[1];return cb()}}catch(e){}
fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=de&q="+encodeURIComponent(ADDR)).then(function(x){return x.json()}).then(function(j){if(j&&j[0]){lat=parseFloat(j[0].lat);lon=parseFloat(j[0].lon);try{localStorage.setItem("geoDummersdorf1",JSON.stringify([lat,lon]))}catch(e){}}cb()}).catch(function(){cb()})}
var map=L.map("map",{zoomControl:false,fadeAnimation:false,zoomAnimation:false,markerZoomAnimation:false,attributionControl:true,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,touchZoom:false,keyboard:false}).setView([lat,lon],zoom);
var E="https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
L.tileLayer(E+"World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxZoom:12,attribution:"Karte © Esri, HERE, OSM | Radar © DWD"}).addTo(map);
map.createPane("radar").style.zIndex=250;
var lp=map.createPane("lab");lp.style.zIndex=260;lp.style.pointerEvents="none";
var WMS="https://maps.dwd.de/geoserver/dwd/wms",LAYER="dwd:Niederschlagsradar",OP=.75;
function mk(extra){var o={layers:LAYER,format:"image/png",transparent:true,version:"1.3.0",opacity:OP,pane:"radar",crossOrigin:false};for(var k in extra)o[k]=extra[k];return L.tileLayer.wms(WMS,o)}
var staticLayer=mk({}).addTo(map);
L.tileLayer(E+"World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}",{maxZoom:12,opacity:.8,pane:"lab"}).addTo(map);
var home=L.circleMarker([lat,lon],{radius:7,color:"#fff",weight:2,fillColor:"#e03131",fillOpacity:1}).addTo(map);
var LUE=[53.8655,10.6866];
function cen(){return q.get("lat")?[lat,lon]:[(lat+LUE[0])/2,(lon+LUE[1])/2]}
var geoReady=false,onGeo=null;
geo(function(){map.setView(cen(),zoom);home.setLatLng([lat,lon]);geoReady=true;if(onGeo)onGeo()});
try{map.attributionControl.setPosition("topright")}catch(e){}
home.bindTooltip("Dummersdorf",{permanent:true,direction:"right",offset:[8,0]});
var st=document.createElement("div");st.className="stand";mapEl.appendChild(st);
var tl=document.createElement("div");tl.className="tl";mapEl.appendChild(tl);
var hd=null,bub=null,T0=0,TN=1;
function hm(d){return new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",hour:"2-digit",minute:"2-digit"}).format(d)}
var frames=[],idx=0,timer=null,loadedAt=new Date();
function stampStatic(){st.textContent="Abruf "+hm(new Date())}
stampStatic();
/* Zeitstufen aus den Capabilities lesen */
function dur(p){var m=/^P(?:T)?(?:(\d+)H)?(?:(\d+)M)?$/.exec(p||"");if(!m)return 5*60000;return ((+m[1]||0)*60+(+m[2]||0))*60000||5*60000}
function timesOf(dimText){
  var out=[];(dimText||"").trim().split(",").forEach(function(p){
    p=p.trim();if(!p)return;var r=p.split("/");
    if(r.length>=2){var a=Date.parse(r[0]),z=Date.parse(r[1]),step=dur(r[2]);if(isNaN(a)||isNaN(z))return;for(var t=z,n=0;t>=a&&n<60;t-=step,n++)out.push(t)}
    else{var t1=Date.parse(p);if(!isNaN(t1))out.push(t1)}
  });
  out.sort(function(x,y){return x-y});return out.filter(function(t,i){return i===0||t!==out[i-1]});
}
/* liefert {Layername: [Zeiten]} für alle Layer mit Zeitdimension, deren Name zum Filter passt */
function parseCaps(xml,re){
  var doc=new DOMParser().parseFromString(xml,"text/xml"),ls=doc.getElementsByTagName("Layer"),res={};
  for(var i=0;i<ls.length;i++){
    var nm=null,dm=null,ch=ls[i].children;
    for(var k=0;k<ch.length;k++){if(ch[k].tagName==="Name")nm=ch[k].textContent.trim();else if(ch[k].tagName==="Dimension"&&String(ch[k].getAttribute("name")).toLowerCase()==="time")dm=ch[k].textContent}
    if(nm&&dm&&re.test(nm)){var t=timesOf(dm);if(t.length)res[nm.replace(/^dwd:/,"")]=t}
  }
  return res;
}
function getCaps(u){return fetch(u,{cache:"no-store"}).then(function(x){if(!x.ok)throw new Error(x.status);return x.text()})}
var CAND=["Radar_wn-product_1x1km_ger","Niederschlagsradar"];
var dbg=q.get("debug")?document.createElement("div"):null;
if(dbg){dbg.style.cssText="position:absolute;left:4px;top:4px;z-index:2000;background:rgba(0,0,0,.8);color:#9f9;font:10px monospace;padding:3px 5px;max-width:95%;white-space:pre-wrap";mapEl.appendChild(dbg)}
function log(t){if(dbg)dbg.textContent+=t+"\n"}
function loadFrames(){
  var base="https://maps.dwd.de/geoserver/dwd/",qs="/wms?service=WMS&version=1.3.0&request=GetCapabilities&_t="+Date.now();
  var jobs=CAND.map(function(n){return getCaps(base+n+qs).then(function(x){return parseCaps(x,/./)}).catch(function(e){log(n+": "+e);return {}})});
  return Promise.all(jobs).then(function(arr){
    var all={};arr.forEach(function(o){for(var k in o)all[k]=o[k]});
    var best=null;for(var k in all){var t=all[k],last=t[t.length-1];if(!best||last>best.last)best={name:k,t:t,last:last}}
    if(best)return best;
    /* Notfall: gesamte Capabilities durchsuchen */
    return getCaps(base+"wms?service=WMS&version=1.3.0&request=GetCapabilities&_t="+Date.now()).then(function(x){
      var all=parseCaps(x,/radar|niederschlag|wn-|rv-/i),best=null;
      for(var k in all){var t=all[k],last=t[t.length-1];if(!best||last>best.last)best={name:k,t:t,last:last}}
      if(!best)throw 0;return best;
    });
  });
}
var curI=-1;function clearFrames(){clearTimeout(timer);frames.forEach(function(f){map.removeLayer(f.l);if(f.blob)try{URL.revokeObjectURL(f.url)}catch(e){}});frames=[];curI=-1}
function rel(t){var m=Math.round((t-Date.now())/60000);if(m>=-2&&m<=2)return "jetzt";return m<0?"vor "+(-m)+" Min":"in "+m+" Min"}
function show(i){
  if(curI>=0&&frames[curI])frames[curI].l.setOpacity(0);
  frames[i].l.setOpacity(OP);curI=i;
  var f=frames[i];
  if(hd){hd.style.left=((f.t-T0)/(TN-T0)*100)+"%";var fc=f.t>Date.now()+150000;bub.textContent=hm(new Date(f.t));bub.className="bub"+(fc?" f":"")}
}

function buildTl(){
  T0=frames[0].t;TN=frames[frames.length-1].t;var now=Math.min(Math.max(Date.now(),T0),TN);
  var pc=function(t){return ((t-T0)/(TN-T0)*100)+"%"};
  var h='<div class="trk"><div class="fcz" style="left:'+pc(now)+'"></div><div class="line"></div>';
  var ts=(TN-T0)>4*3600000?1800000:300000;
  for(var t=Math.ceil(T0/ts)*ts;t<=TN;t+=ts){
    var mn=new Date(t).getMinutes();
    var cls=mn===0?"tk h":(mn%15===0?"tk q":"tk");
    h+='<div class="'+cls+'" style="left:'+pc(t)+'"></div>';
    if(mn===0)h+='<div class="lb" style="left:'+pc(t)+'">'+parseInt(hm(new Date(t)).slice(0,2),10)+'</div>';
  }
  h+='<div class="nl" style="left:'+pc(now)+'"></div><div class="jt" style="left:'+pc(now)+'">Jetzt</div>';
  h+='<div class="hd"><div class="stem"></div><div class="bub"></div><div class="knob"></div></div></div>';
  tl.innerHTML=h;tl.style.display="block";st.style.display="none";
  hd=tl.querySelector(".hd");bub=tl.querySelector(".bub");
}
function play(){
  if(!frames.length)return;
  show(idx);
  var wait=(idx===frames.length-1)?2800:(frames[idx].t<=Date.now()+150000&&(idx+1<frames.length&&frames[idx+1].t>Date.now()+150000)?1400:(frames[idx].model?600:330));
  idx=(idx+1)%frames.length;
  timer=setTimeout(play,wait);
}
function imgUrl(name,t){
  var b=map.getBounds(),sw=L.CRS.EPSG3857.project(b.getSouthWest()),ne=L.CRS.EPSG3857.project(b.getNorthEast()),z=map.getSize();
  return WMS+"?service=WMS&version=1.1.1&request=GetMap&layers=dwd:"+name+"&styles=&format=image/png&transparent=true&srs=EPSG:3857&bbox="+[sw.x,sw.y,ne.x,ne.y].join(",")+"&width="+z.x+"&height="+z.y+"&TIME="+new Date(t).toISOString().replace(".000Z","Z");
}
/* Bild laden und im Speicher halten, damit beim Abspielen nichts nachlädt */
function loadImg(url){
  return fetch(url).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(b){return {url:URL.createObjectURL(b),blob:true}})
  .catch(function(){return new Promise(function(res){var im=new Image();im.onload=function(){res({url:url,blob:false})};im.onerror=function(){res(null)};im.src=url})});
}
var busy=false,modelP=null,modelAt=0;
function getModel(){
  if(!modelP||Date.now()-modelAt>3600000){
    modelAt=Date.now();
    modelP=getCaps("https://maps.dwd.de/geoserver/dwd/wms?service=WMS&version=1.3.0&request=GetCapabilities&_t="+Date.now())
      .then(function(x){var all=parseCaps(x,/prec|niederschlag|regen|rain/i);for(var k in all){if(/radar|^rv|^wn|^rw|^rx|^hx|^sf|^ry/i.test(k))delete all[k]}
        if(dbg){var ks=Object.keys(all);log("Modell-Kandidaten: "+(ks.length?ks.slice(0,8).map(function(k){var t=all[k];return k+" ["+new Date(t[0]).toISOString().slice(5,16)+" bis "+new Date(t[t.length-1]).toISOString().slice(5,16)+"]"}).join("; "):"keine"))}
        return all}).catch(function(e){log("Modell: "+e);return {}});
  }
  return modelP;
}
function start(best){
  var now=Date.now(),t=best.t,ni=0;
  t.forEach(function(x,i){if(x<=now+150000)ni=i});
  /* 5-Minuten-Raster um "jetzt": bis 60 Min zurück, bis 120 Min voraus */
  var step=Math.max(1,Math.round(5*60000/(t.length>1?(t[t.length-1]-t[0])/(t.length-1):300000)));
  var pick=[];for(var k=-12;k<=24;k++){var j=ni+k*step;if(j>=0&&j<t.length)pick.push(t[j])}
  if(pick.indexOf(t[ni])<0)pick.push(t[ni]);
  pick.sort(function(a,b){return a-b});
  if(pick.length<2)throw 0;
  var items=pick.map(function(x){return {t:x,name:best.name}});
  var endNow=pick[pick.length-1];
  return getModel().then(function(models){
    /* Modell-Vorhersage hinter das Radar-Ende anhängen (bis ca. +6 h, alle 30 Min) */
    var bestM=null,lim=now+6.5*3600000;
    for(var n in models){var ts=models[n].filter(function(x){return x>endNow+240000&&x<=lim});if(ts.length>=2&&(!bestM||ts.length>bestM.ts.length))bestM={name:n,ts:ts}}
    if(bestM){var last=endNow;bestM.ts.forEach(function(x){if(x-last>=1700000){items.push({t:x,name:bestM.name,model:true});last=x}});log("Modell-Layer: "+bestM.name)}
    log("Layer: "+best.name+"  Stufen: "+t.length+"  gezeigt: "+items.length);
    return items;
  }).then(function(items){
    var jobs=items.map(function(f){return loadImg(imgUrl(f.name,f.t))});
    var all=Promise.all(jobs),limit=new Promise(function(r){setTimeout(function(){r(null)},60000)});
    return Promise.race([all,limit]).then(function(res){
      if(!res)throw 0;
      var ok=[];res.forEach(function(r,i){if(r)ok.push({t:items[i].t,url:r.url,blob:r.blob,model:items[i].model})});
      if(ok.filter(function(f){return !f.model}).length<2)throw 0;
      /* erst jetzt austauschen: kein Flackern beim Neuladen */
      clearFrames();
      var bounds=map.getBounds();
      ok.forEach(function(f){f.l=L.imageOverlay(f.url,bounds,{pane:"radar",opacity:0,interactive:false}).addTo(map);frames.push(f)});
      map.removeLayer(staticLayer);
      buildTl();idx=0;play();
    });
  });
}
function refresh(){
  if(busy)return;busy=true;
  loadFrames().then(start).then(function(){busy=false},function(){busy=false;throw 0}).catch(function(){
    /* Ohne Zeitstufen: Standbild des DWD neu laden */
    if(frames.length)return; /* laufende Animation behalten */
    clearFrames();tl.style.display="none";st.style.display="";hd=null;if(!map.hasLayer(staticLayer))staticLayer.addTo(map);
    staticLayer.setParams({_t:Date.now()});stampStatic();
  });
}
if(geoReady)refresh();else onGeo=refresh;
setInterval(refresh,5*60*1000);
})();
</script><script>setTimeout(function(){try{var u=new URL(location.href);u.searchParams.set("_r",Date.now());location.replace(u.toString())}catch(e){location.reload()}},60*60*1000);</script>
</body></html>
