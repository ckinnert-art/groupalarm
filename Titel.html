(function(){var t=document.getElementById("ct"),d=document.getElementById("cd");
var ft=new Intl.DateTimeFormat("de-DE",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Europe/Berlin"});
var fd=new Intl.DateTimeFormat("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric",timeZone:"Europe/Berlin"});
function tick(){var n=new Date();t.textContent=ft.format(n);d.textContent=fd.format(n);}
function loop(){tick();setTimeout(loop,1000-(Date.now()%1000)+5);}loop();})();

(function(){var bar=document.querySelector(".bar"),h=document.getElementById("title"),sp=h.firstElementChild;
function fit(){var lo=10,hi=Math.max(20,bar.clientHeight*0.7),i,m;
for(i=0;i<22;i++){m=(lo+hi)/2;sp.style.fontSize=m+"px";if(sp.offsetWidth<=h.clientWidth){lo=m}else{hi=m}}
sp.style.fontSize=lo+"px";}
fit();window.addEventListener("resize",fit);
if(window.ResizeObserver){new ResizeObserver(fit).observe(bar);}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit);}})();
</script></body></html>
