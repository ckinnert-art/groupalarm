<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feuerwehr Dummersdorf Infoleiste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== Optik wie GroupAlarm (gemessen) ===== */
:root{
  --feld:#424242;      /* Feldfarbe dunkel */
  --kopf:#505050;      /* Überschriftszeile */
  --spalt:#303030;     /* Lücke zwischen den Feldern */
  --luecke:3.6px;      /* Breite der Lücke */
  --kopf-hoehe:78px;   /* Höhe Überschriftszeile */
  --kopf-schrift:48px; /* Schrift Überschrift (wird nur verkleinert, wenn sie sonst nicht passt) */
  --ok:#4cc38a
}
html,body{height:100%;margin:0;background:var(--spalt);overflow:hidden}
body{font-family:Roboto,"Segoe UI",Arial,sans-serif;color:#fff}
.grid{box-sizing:border-box;height:100%;display:grid;grid-template-columns:1fr 1.2fr 1.1fr 1.4fr;gap:var(--luecke)}
.cell{position:relative;container-type:size;display:flex;flex-direction:column;overflow:hidden;background:var(--feld);min-width:0}
.cell>h2{margin:0;flex:none;display:flex;align-items:center;justify-content:center;height:var(--kopf-hoehe);box-sizing:border-box;
  padding:0 2.4em 0 10px;text-align:center;font-weight:700;font-size:var(--kopf-schrift);line-height:1;background:var(--kopf);color:#fff;white-space:nowrap;overflow:hidden}
.cell>h2.mitte{padding:0 10px}
.seite{position:absolute;right:10px;top:0;height:var(--kopf-hoehe);display:flex;align-items:center;font-size:20px;color:#d5d5d5;font-variant-numeric:tabular-nums}
.liste{flex:1;min-height:0;display:flex;flex-direction:column}
/* Dienstpläne */
.dp .liste{padding:0 3cqw}
.dp .termin{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;line-height:1.1;border-bottom:1px solid #ffffff22;overflow:hidden}
.dp .termin:last-child{border-bottom:0}
.dp .wann{font-size:min(6.8cqh,5.6cqw);font-weight:700;color:#ffd166;white-space:nowrap;font-variant-numeric:tabular-nums}
.dp .wann span{font-weight:400;color:#d5d5d5;margin-left:.5em}
.dp .was{font-size:min(7.3cqh,5.9cqw);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp .was b{font-weight:500}
.dp .heute .wann{color:var(--ok)}
/* Verband */
.vb .liste{padding:0 2cqw}
.vb .z{flex:1;min-height:0;display:flex;align-items:center;gap:1.6cqw;border-bottom:1px solid #ffffff22;white-space:nowrap;overflow:hidden;font-size:min(8cqh,4.3cqw);line-height:1}
.vb .z:last-child{border-bottom:0}
.vb .d{flex:none;font-weight:700;color:#ffd166;font-variant-numeric:tabular-nums}
.vb .t{flex:none;color:#d5d5d5;font-variant-numeric:tabular-nums}
.vb .n{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.vb .o{flex:none;color:#c4cbe0;font-size:.82em}
.vb .a{flex:none;font-size:.78em;font-weight:700;padding:.22em .5em .2em;border-radius:.3em;background:#c9434a;color:#fff}
.vb .a.h{background:#3f7fd1}.vb .a.s{background:#6b6f76}
/* Sperrungen */
.sp .liste{padding:0 2cqw}
.sp .z{flex:1;min-height:0;display:flex;align-items:center;gap:1.4cqw;border-bottom:1px solid #ffffff22;white-space:nowrap;overflow:hidden;font-size:min(9cqh,4cqw);line-height:1}
.sp .z:last-child{border-bottom:0}
.sp .art{flex:none;width:3.2em;text-align:center;font-size:.66em;font-weight:700;padding:.28em 0 .24em;border-radius:.3em;background:#e3bd4f;color:#26282b}
.sp .voll .art{background:#d9363e;color:#fff}.sp .halb .art{background:#e8862a;color:#26282b}
.sp .s{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.sp .s small{font-size:.66em;font-weight:400;color:#b9bcc2;margin-left:.5em}
.sp .bis{flex:none;font-size:.88em;font-variant-numeric:tabular-nums}
.sp .fuss{flex:none;text-align:right;font-size:min(5.5cqh,13px);color:#b9bcc2;padding:0 2cqw .4em}
.sp .fuss .alt{color:#e8862a;font-weight:700}
.leer{margin:auto;color:#c4cbe0;font-size:min(8cqh,4.3cqw);text-align:center;padding:0 1em}
@media (max-aspect-ratio:1/1){.grid{grid-template-columns:1fr;grid-auto-rows:1fr}}
</style></head>
<body><div class="grid">
<div class="cell dp"><h2 id="dp-titel">Dienstplan</h2><span class="seite" id="dp-seite"></span><div class="liste" id="dp-liste"></div></div>
<div class="cell vb"><h2>Verbandsveranstaltungen</h2><span class="seite" id="vv-seite"></span><div class="liste" id="vv-liste"></div></div>
<div class="cell vb"><h2>Verbandseinsätze</h2><span class="seite" id="ve-seite"></span><div class="liste" id="ve-liste"></div></div>
<div class="cell sp"><h2 id="sp-titel">Sperrungen Kücknitz</h2><span class="seite" id="sp-seite"></span><div class="liste" id="sp-liste"></div><div class="fuss">Quelle: Hansestadt Lübeck · <span id="sp-stand">lädt …</span></div></div>
</div>

<script>
/* ===================== EINSTELLUNGEN ===================== */
var SEKUNDEN = 12;               // alle Felder blättern gemeinsam alle 12 Sekunden um

/* ===================== DIENSTPLÄNE =====================
   Eine Zeile pro Termin: ["Datum JJJJ-MM-TT", "Uhrzeit", "Was"]
   Uhrzeit leer lassen (""), wenn sie noch nicht feststeht.
   Vergangene Termine verschwinden von selbst.                */
var DIENSTPLAENE = [
  { titel: "Dienstplan FF-33", termine: [
    ["2026-10-16", "19:00", "Ausbildungsdienst"],
    ["2026-11-06", "15:45", "Sternmarsch Kücknitzer Jugend"],
    ["2026-11-13", "19:00", "Ausbildungsdienst"],
    ["2026-11-15", "09:00", "Volkstrauertag"],
    ["2026-11-20", "19:00", "Ausbildungsdienst"],
    ["2026-11-29", "15:45", "Kinderweihnacht"],
    ["2026-12-04", "19:00", "Letzter Ausbildungsdienst"],
    ["2026-12-12", "",      "Weihnachtsfeier"]
  ]},
  { titel: "Dienstplan LZG-33", termine: [
    ["2026-10-21", "19:00", "Messen: A-Messgeräte / A-Einsatz"],
    ["2026-11-04", "19:00", "Gesamt: Grundlagen B-Gefahren"],
    ["2026-12-09", "18:00", "Weihnachtsmarkt"]
  ]},
  { titel: "Dienstplan JF-33", termine: [
    ["2026-10-27", "18:00", "Dienst"],
    ["2026-11-03", "18:00", "Dienst"],
    ["2026-11-06", "18:00", "Sternenmarsch (Ende ca. 21 Uhr)"],
    ["2026-11-07", "",      "Nachtwanderung in Krummesse"],
    ["2026-11-10", "18:00", "Dienst"],
    ["2026-11-17", "18:00", "Dienst"],
    ["2026-11-24", "18:00", "Dienst"],
    ["2026-12-01", "18:00", "Dienst"],
    ["2026-12-05", "",      "Weihnachtsfeier"],
    ["2026-12-08", "18:00", "Dienst"]
  ]}
];
var DP_TERMINE_JE_PLAN = 10;     // so viele nächste Termine pro Plan
var DP_ZEILEN_JE_SEITE = 4;      // weniger Zeilen = größere Schrift

/* ============ VERBANDSEINSÄTZE UND -VERANSTALTUNGEN ============
   Die Daten kommen aus verband.json, das GitHub regelmäßig von luebeck.fox112.de holt. */
var VB_ZEILEN_JE_SEITE = 6;      // weniger Zeilen = größere Schrift
var VB_EINSAETZE_MAX = 12;       // so viele letzte Einsätze werden durchgeblättert
/* ======================================================== */

/* ===================== STRASSENSPERRUNGEN =====================
   Daten aus strassensperrungen.json, das GitHub regelmäßig von luebeck.de holt.
   Kücknitz: ALLE aktuellen Sperrungen, auch kleine Straßen (u. a. Kücknitz, Dummersdorf,
   Roter Hahn, Herrenwyk, Siems, Dänischburg). Restliches Lübeck: nur die Hauptstraßen unten. */
var SP_STADTTEILE = ["Kücknitz"];
var SP_PLZ = ["23569"];          // greift nur, wenn die Stadt keinen Stadtteil angibt
var SP_TITEL_BEREICH = "Sperrungen Kücknitz";
var SP_TITEL_HAUPT = "Sperrungen Hauptstraßen";
var SP_HAUPTSTRASSEN = [
  "Travemünder Allee", "Travemünder Landstraße",
  "Ratzeburger Allee", "Ratzeburger Landstraße",
  "Kronsforder Allee", "Kronsforder Landstraße",
  "Moislinger Allee", "Hamburger Straße", "Padelügger Weg", "Geniner Straße",
  "Fackenburger Allee", "Schwartauer Allee", "Schwartauer Landstraße",
  "Krempelsdorfer Allee", "Stockelsdorfer Straße", "Friedhofsallee",
  "Ziegelstraße", "Schönböckener Straße",
  "Bei der Lohmühle", "Karlstraße", "Einsiedelstraße", "Katharinenstraße",
  "Possehlstraße", "Willy-Brandt-Allee", "Lindenplatz", "Holstentorplatz",
  "Kanalstraße", "Falkenstraße", "Hüxtertorallee", "Hüxterdamm", "Wallstraße",
  "Mühlentorplatz", "Berliner Platz", "St. Jürgen Ring",
  "Untertrave", "Gustav-Radbruch-Platz", "Roeckstraße",
  "Heiligen-Geist-Kamp", "Marlistraße", "Arnimstraße",
  "Wesloer Landstraße", "Brandenbaumer Landstraße", "Schlutuper Straße",
  "Nordtangente", "Herrentunnel", "Brücke", "B 75", "A 1", "A 226"
];
var SP_ZEILEN_JE_SEITE = 5;      // weniger Zeilen = größere Schrift
var SP_WARNUNG_AB_STUNDEN = 8;   // ältere Daten: Uhrzeit wird orange
/* ======================================================== */

var TAGE=["So","Mo","Di","Mi","Do","Fr","Sa"];
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

/* Überschrift so groß wie GroupAlarm, nur verkleinern, wenn der Text sonst nicht passt */
/* alle Überschriften bekommen dieselbe Größe: die größte, bei der jeder mögliche Titel passt
   (auch die wechselnden Dienstplan- und Sperrungen-Titel), damit beim Umblättern nichts springt */
var kopfGroesse=0;
function kopfEinpassen(){
  var k=[].slice.call(document.querySelectorAll(".cell>h2")),
      g=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--kopf-schrift"))||48;
  var kandidaten={"dp-titel":DIENSTPLAENE.map(function(p){return p.titel}),"sp-titel":[SP_TITEL_BEREICH,SP_TITEL_HAUPT]};
  function passt(){return k.every(function(t){
    var alt=t.textContent,liste=kandidaten[t.id]||[alt],ok=liste.every(function(x){t.textContent=x;return t.scrollWidth<=t.clientWidth});
    t.textContent=alt;return ok})}
  function setze(){k.forEach(function(t){t.style.fontSize=g+"px"})}
  setze();while(!passt()&&g>16){g--;setze()}
  kopfGroesse=g;
}

/* ---------- Dienstpläne ---------- */
var DP=(function(){
  var seiten=[],nr=-1;
  function bauen(){
    var h=new Date();h.setHours(0,0,0,0);seiten=[];
    DIENSTPLAENE.forEach(function(p){
      var t=p.termine.map(function(e){var d=e[0].split("-");return{d:new Date(+d[0],d[1]-1,+d[2]),zeit:e[1],was:e[2]}})
        .filter(function(e){return e.d>=h}).sort(function(a,b){return a.d-b.d||a.zeit.localeCompare(b.zeit)}).slice(0,DP_TERMINE_JE_PLAN);
      var n=Math.ceil(t.length/DP_ZEILEN_JE_SEITE);
      for(var i=0;i<n;i++)seiten.push({titel:p.titel,teil:n>1?(i+1)+"/"+n:"",t:t.slice(i*DP_ZEILEN_JE_SEITE,(i+1)*DP_ZEILEN_JE_SEITE),heute:h});
    });
  }
  function weiter(){
    nr++; if(nr>=seiten.length){bauen();nr=0;}
    var s=seiten[nr],L=document.getElementById("dp-liste"),T=document.getElementById("dp-titel");
    if(!s){T.textContent="Dienstplan";L.innerHTML='<div class="leer">Keine Termine</div>';return;}
    T.textContent=s.titel;
    document.getElementById("dp-seite").textContent=s.teil;
    var html="";
    for(var i=0;i<DP_ZEILEN_JE_SEITE;i++){var e=s.t[i];
      if(!e){html+='<div class="termin" style="border:0"></div>';continue;}
      var tt=("0"+e.d.getDate()).slice(-2)+"."+("0"+(e.d.getMonth()+1)).slice(-2)+".";
      var heute=e.d.getTime()===s.heute.getTime();
      html+='<div class="termin'+(heute?" heute":"")+'"><div class="wann">'+(heute?"Heute":TAGE[e.d.getDay()]+" "+tt)+(e.zeit?"<span>"+esc(e.zeit)+" Uhr</span>":"")+'</div><div class="was"><b>'+esc(e.was)+"</b></div></div>";}
    L.innerHTML=html;
    // zu lange Texte einzeln etwas verkleinern, bevor sie abgeschnitten werden
    [].forEach.call(L.querySelectorAll(".was"),function(z){var b=z.firstChild;
      if(b.offsetWidth>z.clientWidth)b.style.fontSize=Math.max(.72,z.clientWidth/b.offsetWidth*.99)+"em";});
  }
  bauen();
  return {weiter:weiter};
})();

/* ---------- Verbandseinsätze und -veranstaltungen ---------- */
var VB=(function(){
  var daten=null,nr={vv:0,ve:0};
  function tag(d){var m=/(\d{2})\.(\d{2})\.(\d{4})/.exec(d||"");return m?new Date(+m[3],m[2]-1,+m[1]):null}
  function zeile(id,e){
    var d=tag(e.datum),kurz=d?e.datum.slice(0,6):esc(e.datum);
    if(id==="vv")return '<div class="z"><span class="d">'+(d?TAGE[d.getDay()]+" ":"")+kurz+'</span>'+(e.zeit?'<span class="t">'+esc(e.zeit)+'</span>':'')+
      '<span class="n">'+esc(e.name)+'</span>'+(e.ort?'<span class="o">'+esc(e.ort)+'</span>':'')+'</div>';
    var art=String(e.art||""),kl=/brand/i.test(art)?"":/hilfe/i.test(art)?" h":" s";
    return '<div class="z"><span class="d">'+kurz+'</span><span class="t">'+esc(e.zeit)+'</span><span class="n">'+esc(e.wehr)+'</span>'+
      (art?'<span class="a'+kl+'">'+esc(art.replace(/s?einsatz$/i,""))+'</span>':'')+'</div>';
  }
  function zeigen(id,weiter){
    if(!daten)return;
    var h=new Date();h.setHours(0,0,0,0);
    var liste=id==="vv"?(daten.veranstaltungen||[]).filter(function(e){var d=tag(e.datum);return !d||d>=h})
                       :(daten.einsaetze||[]).slice(0,VB_EINSAETZE_MAX);
    var n=Math.max(1,Math.ceil(liste.length/VB_ZEILEN_JE_SEITE));
    if(weiter)nr[id]++; if(nr[id]>=n)nr[id]=0;
    var teil=liste.slice(nr[id]*VB_ZEILEN_JE_SEITE,(nr[id]+1)*VB_ZEILEN_JE_SEITE),html="";
    for(var i=0;i<VB_ZEILEN_JE_SEITE;i++)html+=teil[i]?zeile(id,teil[i]):'<div class="z" style="border:0"></div>';
    document.getElementById(id+"-liste").innerHTML=liste.length?html:'<div class="leer">Keine Einträge</div>';
    // zu lange Namen einzeln etwas verkleinern, bevor sie abgeschnitten werden
    [].forEach.call(document.querySelectorAll("#"+id+"-liste .n"),function(z){
      if(z.scrollWidth>z.clientWidth)z.style.fontSize=Math.max(.8,z.clientWidth/z.scrollWidth*.98)+"em";});
    document.getElementById(id+"-seite").textContent=n>1?(nr[id]+1)+"/"+n:"";
  }
  function laden(){
    fetch("verband.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()})
      .then(function(j){daten=j;zeigen("vv");zeigen("ve")}).catch(function(){});
  }
  laden();setInterval(laden,5*60*1000);
  return {weiter:function(){zeigen("vv",true);zeigen("ve",true)}};
})();

/* ---------- Straßensperrungen ---------- */
var SP=(function(){
  var seiten=[],nr=0,daten=null;
  function norm(s){return String(s||"").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/str\./g,"strasse").replace(/[^a-z0-9]/g,"")}
  var HAUPT=SP_HAUPTSTRASSEN.map(norm);
  // kurze Kürzel wie "A 1" nur als ganzes Wort werten, sonst träfe "a1" auch Hausnummern
  function hauptTreffer(t){var n=norm(t);return SP_HAUPTSTRASSEN.some(function(name,i){
    return /^[AB] ?\d+$/.test(name)?new RegExp("(^|[^A-Za-z0-9])"+name.replace(" "," ?")+"($|[^0-9])").test(t):n.indexOf(HAUPT[i])>=0})}
  function datum(t){var m=/(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(t||"");return m?new Date(+m[3],+m[2]-1,+m[1]):null}
  function kurz(d,h){return ("0"+d.getDate()).slice(-2)+"."+("0"+(d.getMonth()+1)).slice(-2)+"."+(d.getFullYear()!==h.getFullYear()?String(d.getFullYear()).slice(2):"")}
  function art(w){if(/vollsperrung|sperrung der stra/i.test(w))return["voll","VOLL"];if(/halbseitig|einbahn/i.test(w))return["halb","HALB"];return["eng","ENG"]}
  function bauen(){
    seiten=[];if(!daten)return;
    var heute=new Date();heute.setHours(0,0,0,0);var bereich=[],haupt=[];
    (daten.baustellen||[]).forEach(function(b){
      var teile=String(b.dates||"").split(/\s+bis\s+/),von=datum(teile[0]),bis=datum(teile[1]||teile[0]);
      if(bis&&bis<heute)return;                              // schon vorbei
      if(von?von>heute:b.status==="geplant")return;          // noch nicht begonnen
      var im=SP_STADTTEILE.indexOf(b.teil)>=0||(!b.teil&&SP_PLZ.indexOf(b.plz)>=0);
      if(!im&&!hauptTreffer(b.title))return;
      var a=art(b.wirkung);
      (im?bereich:haupt).push({kl:a[0],k:a[1],bis:bis?"bis "+kurz(bis,heute):"",t:b.title,teil:im?"":(b.teil||"")});
    });
    var rang={voll:0,halb:1,eng:2};
    function sortieren(x,y){return(rang[x.kl]-rang[y.kl])||x.t.localeCompare(y.t,"de")}
    [[SP_TITEL_BEREICH,bereich.sort(sortieren)],[SP_TITEL_HAUPT,haupt.sort(sortieren)]].forEach(function(g){
      var n=Math.max(1,Math.ceil(g[1].length/SP_ZEILEN_JE_SEITE));
      for(var i=0;i<n;i++)seiten.push({titel:g[0],teil:n>1?(i+1)+"/"+n:"",e:g[1].slice(i*SP_ZEILEN_JE_SEITE,(i+1)*SP_ZEILEN_JE_SEITE)});
    });
    if(nr>=seiten.length)nr=0;
  }
  function zeigen(){
    var s=seiten[nr],L=document.getElementById("sp-liste");if(!s)return;
    document.getElementById("sp-titel").textContent=s.titel;
    document.getElementById("sp-seite").textContent=s.teil;
    var html="";
    if(!s.e.length)html='<div class="leer">Keine Sperrungen gemeldet</div>';
    else for(var i=0;i<SP_ZEILEN_JE_SEITE;i++){var e=s.e[i];
      html+=e?'<div class="z '+e.kl+'"><span class="art">'+e.k+'</span><span class="s"><b>'+esc(e.t)+'</b>'+(e.teil?'<small>'+esc(e.teil)+'</small>':'')+'</span><span class="bis">'+esc(e.bis)+'</span></div>'
             :'<div class="z" style="border:0"></div>';}
    L.innerHTML=html;
    // Zeilen einzeln einpassen: erst den Stadtteil weglassen, dann den Namen verkleinern
    [].forEach.call(L.querySelectorAll(".s"),function(z){var b=z.firstChild,o=z.querySelector("small");
      if(o&&z.scrollWidth>z.clientWidth)o.remove();
      if(b.offsetWidth>z.clientWidth)b.style.fontSize=Math.max(.62,z.clientWidth/b.offsetWidth*.99)+"em";});
    var st=new Date(daten.stand),el=document.getElementById("sp-stand");
    if(isNaN(st)){el.textContent="";return;}
    var alt=(Date.now()-st)/36e5>SP_WARNUNG_AB_STUNDEN,uhr=st.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
    el.textContent=alt?"Daten vom "+st.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})+" "+uhr+" Uhr":"Stand "+uhr+" Uhr";
    el.className=alt?"alt":"";
  }
  function laden(){
    fetch("strassensperrungen.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()})
      .then(function(j){var erst=!daten;daten=j;bauen();if(erst)zeigen();})
      .catch(function(){if(!daten)document.getElementById("sp-stand").textContent="Daten nicht erreichbar";});
  }
  laden();setInterval(laden,10*60*1000);
  return {weiter:function(){if(seiten.length>1){nr=(nr+1)%seiten.length;zeigen();}},
          titel:[SP_TITEL_BEREICH,SP_TITEL_HAUPT]};
})();

/* ---------- Gemeinsamer Takt: alle Felder blättern gleichzeitig um ---------- */
DP.weiter();
setInterval(function(){DP.weiter();VB.weiter();SP.weiter();},SEKUNDEN*1000);

kopfEinpassen();
window.addEventListener("resize",kopfEinpassen);
if(document.fonts)document.fonts.ready.then(kopfEinpassen);

/* einmal pro Stunde komplett neu laden */
setTimeout(function(){try{var u=new URL(location.href);u.searchParams.set("_r",Date.now());location.replace(u.toString())}catch(e){location.reload()}},60*60*1000);
</script>
</body></html>
