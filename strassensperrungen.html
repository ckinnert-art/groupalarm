<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Straßensperrungen</title>
<style>
  :root {
    --flaeche: #3d3f42;      /* entspricht dem GroupAlarm-Dark-Panel #62656573 auf dunklem Grund */
    --kopf: #55585c;         /* Überschriftszeile, heller als die Fläche (wie bei GroupAlarm) */
    --linie: #ffffff1f;
    --text: #ffffff;
    --leise: #b9bcc2;
    --voll: #d9363e;
    --halb: #e8862a;
    --eng: #e3bd4f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  html { font-size: clamp(12px, calc(1.1vw + 1.6vh), 40px); }
  body {
    background: var(--flaeche); color: var(--text);
    font-family: Roboto, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    background: var(--kopf); padding: .22rem .6rem .26rem; flex: none;
    display: grid; grid-template-columns: 3rem minmax(0, 1fr) 3rem; align-items: baseline;
  }
  h1 { grid-column: 2; text-align: center; font-size: 1.75rem; font-weight: 700; color: #e9eaec; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #seite { grid-column: 3; text-align: right; font-size: 1.2rem; color: #e9eaec; white-space: nowrap; font-variant-numeric: tabular-nums; }
  main { flex: 1; min-height: 0; padding: .1rem .55rem 0; overflow: hidden; }
  #liste { height: 100%; overflow: hidden; }
  .zeile {
    display: grid; grid-template-columns: 2.7em minmax(0, 1fr) auto; column-gap: .4em; align-items: center;
    padding: .2em 0 .22em; border-bottom: 1px solid var(--linie); line-height: 1.25;
  }
  .zeile:last-child { border-bottom: 0; }
  .art {
    font-size: .66em; font-weight: 700; letter-spacing: .02em; text-align: center; white-space: nowrap;
    padding: .28em 0 .24em; border-radius: .3em; background: var(--eng); color: #26282b;
  }
  .voll .art { background: var(--voll); color: #fff; }
  .halb .art { background: var(--halb); color: #26282b; }
  .strasse b { font-weight: 500; }
  .strasse { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .strasse small { font-size: .66em; font-weight: 400; color: var(--leise); margin-left: .6em; }
  .zeit { font-size: .88em; color: var(--text); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .leer { color: var(--leise); padding: .5em .1em; }
  footer {
    flex: none; text-align: right; padding: .12rem .6rem .2rem;
    font-size: .72rem; color: var(--leise); white-space: nowrap;
  }
  #stand.alt { color: var(--halb); font-weight: 700; }
</style>
</head>
<body>
<header><h1 id="titel">Straßensperrungen</h1><span id="seite"></span></header>
<main><div id="liste"></div></main>
<footer>Quelle: Hansestadt Lübeck · <span id="stand">lädt …</span></footer>

<script>
/* ===================== EINSTELLUNGEN ===================== */

// Kücknitz: hier werden ALLE aktuellen Sperrungen angezeigt, auch kleine Straßen.
// Zum Stadtteil gehören u. a. Kücknitz, Dummersdorf, Roter Hahn, Herrenwyk, Siems und Dänischburg.
const BEREICH_STADTTEILE = ["Kücknitz"];
const BEREICH_PLZ = ["23569"];       // greift nur, wenn die Stadt keinen Stadtteil angibt

const TITEL_BEREICH = "Sperrungen Kücknitz";
const TITEL_HAUPT = "Sperrungen Lübeck Hauptstraßen";

// Restliches Lübeck: nur Einträge, deren Titel eine dieser Straßen enthält.
// Zeilen einfach ergänzen oder löschen. Schreibweise mit oder ohne Bindestrich ist egal.
const HAUPTSTRASSEN = [
  "Travemünder Allee", "Travemünder Landstraße",
  "Ratzeburger Allee", "Ratzeburger Landstraße",
  "Kronsforder Allee", "Kronsforder Landstraße",
  "Moislinger Allee", "Hamburger Straße", "Padelügger Weg", "Geniner Straße",
  "Fackenburger Allee", "Schwartauer Allee", "Schwartauer Landstraße",
  "Krempelsdorfer Allee", "Stockelsdorfer Straße", "Friedhofsallee",
  "Ziegelstraße", "Schönböckener Straße",
  "Bei der Lohmühle", "Karlstraße", "Einsiedelstraße", "Katharinenstraße",
  "Possehlstraße", "Willy-Brandt-Allee", "Lindenplatz", "Holstentorplatz",
  "Kanalstraße", "Falkenstraße", "Hüxtertorallee", "Hüxterdamm", "Wallstraße",
  "Mühlentorplatz", "Berliner Platz", "St. Jürgen Ring",
  "Untertrave", "Gustav-Radbruch-Platz", "Roeckstraße",
  "Heiligen-Geist-Kamp", "Marlistraße", "Arnimstraße",
  "Wesloer Landstraße", "Brandenbaumer Landstraße", "Schlutuper Straße",
  "Nordtangente", "Herrentunnel", "Brücke", "B 75", "A 1", "A 226"
];

const ZEILEN_JE_SEITE = 6;           // weniger Zeilen = größere Schrift, aber mehr Seiten
const SCHRIFT_MAX = 44;              // größte Schrift in Pixel (bei wenigen Einträgen)
const SCHRIFT_MIN = 15;              // kleiner wird es nie; dann kommen lieber mehr Seiten
const LANGE_NAMEN_BIS = 0.62;        // lange Straßennamen werden einzeln bis auf diesen Anteil verkleinert, erst dann abgeschnitten
const SEITENWECHSEL_SEKUNDEN = 12;
const NEU_LADEN_MINUTEN = 10;
const WARNUNG_AB_STUNDEN = 8;        // Daten älter als das: Uhrzeit wird orange (Abruf schreibt spätestens alle 6 Stunden neu)

/* ========================================================== */

const norm = s => String(s || "").toLowerCase()
  .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
  .replace(/str\./g, "strasse").replace(/[^a-z0-9]/g, "");
const HAUPT = HAUPTSTRASSEN.map(norm);
// kurze Kürzel wie "A 1" nur als ganzes Wort werten, sonst träfe "a1" auch Hausnummern
const hauptTreffer = titel => {
  const n = norm(titel);
  return HAUPTSTRASSEN.some((name, i) =>
    /^[AB] ?\d+$/.test(name)
      ? new RegExp("(^|[^A-Za-z0-9])" + name.replace(" ", " ?") + "($|[^0-9])").test(titel)
      : n.includes(HAUPT[i]));
};

function datum(t) {
  const m = /(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(t || "");
  return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null;
}
function kurz(d, heute) {
  const tt = String(d.getDate()).padStart(2, "0"), mm = String(d.getMonth() + 1).padStart(2, "0");
  return tt + "." + mm + "." + (d.getFullYear() !== heute.getFullYear() ? String(d.getFullYear()).slice(2) : "");
}
function art(w) {
  if (/vollsperrung|sperrung der stra/i.test(w)) return ["voll", "VOLL"];
  if (/halbseitig|einbahn/i.test(w)) return ["halb", "HALB"];
  return ["eng", "ENG"];
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function aufbereiten(daten) {
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  const bereich = [], haupt = [];
  for (const b of daten) {
    const teile = String(b.dates || "").split(/\s+bis\s+/);
    const von = datum(teile[0]), bis = datum(teile[1] || teile[0]);
    if (bis && bis < heute) continue;                       // schon vorbei
    if (von ? von > heute : b.status === "geplant") continue; // noch nicht begonnen
    const imBereich = BEREICH_STADTTEILE.includes(b.teil) || (!b.teil && BEREICH_PLZ.includes(b.plz));
    if (!imBereich && !hauptTreffer(b.title)) continue;
    const [klasse, kuerzel] = art(b.wirkung);
    (imBereich ? bereich : haupt).push({
      klasse, kuerzel, zeit: bis ? "bis " + kurz(bis, heute) : "", titel: b.title,
      teil: imBereich ? "" : (b.teil || "")
    });
  }
  const rang = { voll: 0, halb: 1, eng: 2 };
  const nachArt = (a, b) => (rang[a.klasse] - rang[b.klasse]) || a.titel.localeCompare(b.titel, "de");
  return { bereich: bereich.sort(nachArt), haupt: haupt.sort(nachArt) };
}

function zeileHtml(e) {
  return '<div class="zeile ' + e.klasse + '">' +
    '<span class="art">' + e.kuerzel + "</span>" +
    '<span class="strasse">' + "<b>" + esc(e.titel) + "</b>" + (e.teil ? "<small>" + esc(e.teil) + "</small>" : "") + "</span>" +
    '<span class="zeit">' + esc(e.zeit) + "</span></div>";
}

let seiten = [], aktuelleSeite = 0, letzteDaten = null;

// Größte Schrift, bei der der Inhalt noch ganz in die Fläche passt (0 = passt auch bei SCHRIFT_MIN nicht)
function schriftFuer(html) {
  const liste = document.getElementById("liste");
  liste.innerHTML = html;
  for (let px = SCHRIFT_MAX; px >= SCHRIFT_MIN; px--) {
    liste.style.fontSize = px + "px";
    if (liste.scrollHeight <= liste.clientHeight) return px;
  }
  return 0;
}

function seitenBauen() {
  if (!letzteDaten) return;
  const { bereich, haupt } = aufbereiten(letzteDaten.baustellen || []);
  const liste = document.getElementById("liste");
  liste.style.visibility = "hidden";
  seiten = [];
  const gruppe = (titel, eintraege) => {
    if (!eintraege.length) {
      seiten.push({ titel, html: '<div class="leer">Keine Sperrungen gemeldet.</div>', px: Math.min(SCHRIFT_MAX, 22) });
      return;
    }
    // so wenige Seiten wie nötig; nur wenn die Schrift zu klein würde, weitere Seiten nehmen
    for (let n = Math.ceil(eintraege.length / ZEILEN_JE_SEITE); ; n++) {
      const jeSeite = Math.ceil(eintraege.length / n), teile = [];
      for (let i = 0; i < eintraege.length; i += jeSeite) teile.push(eintraege.slice(i, i + jeSeite).map(zeileHtml).join(""));
      const px = schriftFuer(teile[0]);
      if (px || jeSeite === 1) {
        teile.forEach((html, i) => seiten.push({
          titel: titel + " (" + eintraege.length + ")", html, px: px || SCHRIFT_MIN,
          teil: teile.length > 1 ? (i + 1) + "/" + teile.length : ""
        }));
        return;
      }
    }
  };
  gruppe(TITEL_BEREICH, bereich);
  gruppe(TITEL_HAUPT, haupt);
  liste.style.visibility = "";
  if (aktuelleSeite >= seiten.length) aktuelleSeite = 0;
  zeigen();
}

function zeigen() {
  const s = seiten[aktuelleSeite]; if (!s) return;
  const liste = document.getElementById("liste");
  liste.style.fontSize = s.px + "px"; liste.innerHTML = s.html;
  // Zeilen einzeln einpassen: erst den Stadtteil weglassen, dann den Namen verkleinern
  for (const z of liste.querySelectorAll(".strasse")) {
    const name = z.firstChild, ort = z.querySelector("small");
    if (ort && z.scrollWidth > z.clientWidth) ort.remove();
    if (name.offsetWidth > z.clientWidth)
      name.style.fontSize = Math.max(LANGE_NAMEN_BIS, z.clientWidth / name.offsetWidth * 0.99) + "em";
  }
  document.getElementById("titel").textContent = s.titel;
  document.getElementById("seite").textContent = s.teil || "";
  const el = document.getElementById("stand");
  const stand = new Date(letzteDaten.stand);
  if (isNaN(stand)) { el.textContent = ""; return; }
  const alt = (Date.now() - stand) / 36e5 > WARNUNG_AB_STUNDEN;
  const uhr = stand.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  const tag = stand.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
  el.textContent = alt ? "Daten vom " + tag + " " + uhr + " Uhr" : "Stand " + uhr + " Uhr";
  el.classList.toggle("alt", alt);
}

async function laden() {
  try {
    const r = await fetch("strassensperrungen.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    letzteDaten = await r.json();
    seitenBauen();
  } catch (e) {
    if (!letzteDaten) document.getElementById("stand").textContent = "Daten nicht erreichbar";
  }
}

laden();
setInterval(laden, NEU_LADEN_MINUTEN * 60000);
setInterval(() => { if (seiten.length > 1) { aktuelleSeite = (aktuelleSeite + 1) % seiten.length; zeigen(); } }, SEITENWECHSEL_SEKUNDEN * 1000);
let t; addEventListener("resize", () => { clearTimeout(t); t = setTimeout(seitenBauen, 200); });
</script>
</body>
</html>
